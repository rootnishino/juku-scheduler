<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>冬期講習 回答一覧（講師用）</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--fg:#222;--sub:#666;--line:#ddd;--head:#f0f0ee;--ok:#e6f4e6;--x:#f4b6b6;--xfg:#a00;--t:#fde7a6;--q:#cfe3f7;--warn:#d9822b}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1e;--card:#2a2a2d;--fg:#eee;--sub:#aaa;--line:#444;--head:#35353a;--ok:#25402a;--x:#6b2f2f;--xfg:#ffb3b3;--t:#6b5a1c;--q:#27455f}}
body{font-family:-apple-system,"Hiragino Sans",sans-serif;margin:0;padding:16px;background:var(--bg);color:var(--fg)}
h1{font-size:20px;margin:0 0 12px}
.box{background:var(--card);border-radius:8px;padding:12px 16px;margin-bottom:16px;line-height:1.8;max-width:420px}
.box label{display:block;font-size:13px;color:var(--sub);margin-top:6px}
.box input{font-size:16px;padding:6px 8px;width:100%;box-sizing:border-box}
button{font-size:15px;padding:8px 16px;margin-top:10px}
.err{color:#c0392b}
.sum{max-width:none}.sum b{font-size:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,640px),1fr));gap:12px}
.card{background:var(--card);border-radius:8px;padding:10px 14px}.card.tight{outline:2px solid var(--warn)}
.card h2{font-size:16px;margin:0 0 4px}.card h2 small{font-weight:normal;color:var(--sub);margin-left:8px}
.meta,.memo{font-size:12px;color:var(--sub);margin:2px 0}.memo{color:var(--warn)}.late{color:#c0392b}
.weeks{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
table{border-collapse:collapse;font-size:11px;table-layout:fixed}
th,td{border:1px solid var(--line);text-align:center;padding:2px 0;width:32px;overflow:hidden;white-space:nowrap}th{background:var(--head);font-weight:normal}
td.mx{background:var(--x);color:var(--xfg)}td.mt{background:var(--t)}td.mq{background:var(--q)}td.mo{background:var(--ok)}
.tabs{margin-bottom:12px}.tabs button{margin:0 6px 0 0;padding:4px 12px}.tabs button.on{font-weight:bold;text-decoration:underline}
.hidden{display:none}
.plist a{display:inline-block;margin:2px 8px 2px 0;padding:4px 10px;border:1px solid var(--line);border-radius:6px;text-decoration:none;color:var(--fg);background:var(--card)}
.plist a.done{opacity:.6}.plist h3{font-size:14px;margin:12px 0 4px}
.edit{font-size:12px;margin-left:8px}
</style>
</head>
<body>
<h1>冬期講習 回答一覧（講師用）</h1>

<div id="login" class="box">
  <div>講師の番号と氏名で入ります（提出ページと同じものです）。</div>
  <label for="no">番号（数字）</label><input id="no" inputmode="numeric" autocomplete="off">
  <label for="nm">氏名（フルネーム）</label><input id="nm" autocomplete="off">
  <button id="go">表示する</button>
  <div id="msg" class="err"></div>
</div>

<div id="main" class="hidden">
  <div class="box sum" id="sum"></div>
  <div class="tabs"><button data-f="all" class="on">全員</button><button data-f="student">生徒</button><button data-f="teacher">講師</button><button data-f="proxy">代理入力</button><button id="reload">更新</button><a href="student.html" style="margin-left:6px">自分の予定を出す</a></div>
  <div class="cards" id="cards"></div>
</div>

<script>
const ENDPOINT = "https://script.google.com/macros/s/AKfycbxg9eKtL1lgy0m6Nl3jHVO_esfZ0AF-rvPXDh89SQnpyogbXrc3pqVarDMy2LWEZpqLGw/exec";
const KEY = "winter2026_view_cred";
const WD = "日月火水木金土";
const MARK = {x:"×", t:"△", q:"？"};
const $ = id => document.getElementById(id);
let cred = null, data = null, filter = "all";

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
async function post(body){
  const r = await fetch(ENDPOINT, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(body)});
  return r.json();
}
async function load(no, name, auto){
  $("msg").textContent = "";
  let res;
  try { res = await post({action:"overview", t:no, name:name}); }
  catch(e){ $("msg").textContent = "つながりませんでした。時間をおいてもう一度試してください。"; return; }
  if(!res.ok){
    if(auto){ try{ localStorage.removeItem(KEY); }catch(_){} }
    $("msg").textContent = res.error === "not_found" ? "番号と氏名が合わないか、講師として登録されていません。" : "うまく表示できませんでした。";
    return;
  }
  cred = {no, name}; data = res;
  try{ localStorage.setItem(KEY, JSON.stringify(cred)); }catch(_){}
  $("login").classList.add("hidden"); $("main").classList.remove("hidden");
  render();
}
function render(){
  const slots = data.weeks * data.dows.length * data.komas.length;
  const ppl = data.people;
  const stu = ppl.filter(p => p.grade !== "講師"), tea = ppl.filter(p => p.grade === "講師");
  const miss = a => a.filter(p => !p.submitted).map(p => p.name).join("、") || "なし";
  $("sum").innerHTML = `生徒 <b>${stu.filter(p=>p.submitted).length}</b>/${stu.length}名が提出　講師 <b>${tea.filter(p=>p.submitted).length}</b>/${tea.length}名が提出<br>`
    + `未提出の生徒：${esc(miss(stu))}<br>未提出の講師：${esc(miss(tea))}<br>`
    + `<small>緑＝来られる　赤×＝来られない　黄△＝避けたい　青？＝未定。未提出の人は、まだ予定が分かりません。</small>`;
  const start = new Date(data.start + "T00:00:00+09:00");
  if(filter === "proxy"){
    const byGrade = {};
    stu.forEach(p => (byGrade[p.grade] = byGrade[p.grade] || []).push(p));
    $("cards").className = "plist";
    $("cards").innerHTML = '<p class="meta">生徒の名前を押すと、その生徒の代わりに入力できます（提出済みの人は、直せます）。薄い表示は提出済みです。</p>'
      + Object.keys(byGrade).sort((a,b) => a.localeCompare(b, "ja")).map(g =>
        `<h3>${esc(g)}</h3>` + byGrade[g].sort((a,b) => a.name.localeCompare(b.name, "ja")).map(p =>
          `<a class="${p.submitted ? "done" : ""}" href="student.html#proxy=${p.ref}">${esc(p.name)}${p.submitted ? " ✓" : ""}</a>`).join("")).join("");
    return;
  }
  $("cards").className = "cards";
  const list = ppl.filter(p => p.submitted && (filter === "all" || (filter === "teacher") === (p.grade === "講師")));
  list.sort((a,b) => (a.grade === "講師") - (b.grade === "講師") || a.grade.localeCompare(b.grade, "ja") || a.name.localeCompare(b.name, "ja"));
  $("cards").innerHTML = list.map(p => {
    const nx = Object.values(p.marks).filter(v => v === "x").length;
    let h = `<section class="card"><h2>${esc(p.name)}${p.grade === "講師" ? " 先生" : ""}<small>${esc(p.grade)}</small>${p.grade === "講師" ? "" : `<a class="edit" href="student.html#proxy=${p.ref}">代理入力・直す</a>`}</h2>`
      + `<p class="meta">提出 ${esc(p.at)}${p.subjects ? " ／ 科目 " + esc(p.subjects) : ""} ／ 来られる枠 ${slots - nx}/${slots}${p.late ? ' ／ <b class="late">締切後</b>' : ""}</p>`;
    if(p.memo.trim()) h += `<p class="memo">補足：${esc(p.memo.trim())}</p>`;
    h += '<div class="weeks">';
    for(let w = 0; w < data.weeks; w++){
      h += `<table style="width:${(data.dows.length+1)*32}px"><thead><tr><th></th>`;
      for(const d of data.dows){
        const day = new Date(start.getTime() + (7*w + d) * 86400000);
        const jd = new Date(day.getTime() + 9*3600000);   // 日本の日付で表示する
        h += `<th>${jd.getUTCMonth()+1}/${jd.getUTCDate()}<br>${WD[d]}</th>`;
      }
      h += "</tr></thead><tbody>";
      for(const k of data.komas){
        h += `<tr><th>${k}限</th>`;
        for(const d of data.dows){
          const v = p.marks[`${w}_${d}_${k}`];
          h += `<td class="m${v || "o"}">${MARK[v] || ""}</td>`;
        }
        h += "</tr>";
      }
      h += "</tbody></table>";
    }
    return h + "</div></section>";
  }).join("") || "<p>まだ提出がありません。</p>";
}
$("go").onclick = () => {
  const no = $("no").value.normalize("NFKC").replace(/\s+/g, ""), nm = $("nm").value;
  if(!/^[0-9]{4,10}$/.test(no) || !nm.trim()){ $("msg").textContent = "番号（数字）と氏名を入れてください。"; return; }
  load(no, nm, false);
};
$("reload").onclick = () => load(cred.no, cred.name, false);
document.querySelectorAll(".tabs button[data-f]").forEach(b => b.onclick = () => {
  filter = b.dataset.f;
  document.querySelectorAll(".tabs button[data-f]").forEach(x => x.classList.toggle("on", x === b));
  render();
});
try{ const c = JSON.parse(localStorage.getItem(KEY) || localStorage.getItem("winter2026_cred") || "null"); if(c && c.no && c.name) load(c.no, c.name, true); }catch(_){}
</script>
</body>
</html>
